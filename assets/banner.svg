      <rect x="1048" y="0" width="30" height="300"/><rect x="1080" y="0" width="30" height="300"/><rect x="1112" y="0" width="30" height="300"/>
      <rect x="1144" y="0" width="30" height="300"/><rect x="1176" y="0" width="24" height="300"/>
    </g>
    <g fill="#0d1117">
