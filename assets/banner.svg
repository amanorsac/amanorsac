      <rect x="877" y="0" width="20" height="180"/><rect x="909" y="0" width="20" height="180"/><rect x="941" y="0" width="20" height="180"/>
      <rect x="1005" y="0" width="20" height="180"/><rect x="1037" y="0" width="20" height="180"/>
      <rect x="1101" y="0" width="20" height="180"/><rect x="1133" y="0" width="20" height="180"/><rect x="1165" y="0" width="20" height="180"/>
